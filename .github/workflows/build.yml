name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: Build a signed release APK after checks
        required: false
        type: boolean
        default: false
      release_version_code:
        description: Explicit versionCode for this release
        required: false
        type: string
        default: ''

permissions:
  contents: read

# Keep signed APK version codes above the latest previously published build.
env:
  UPDATE_BASELINE_VERSION_CODE: '106'

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug -PappVersionCode=$((GITHUB_RUN_NUMBER + 40)) --stacktrace --info --refresh-dependencies 2>&1 | tee "$RUNNER_TEMP/build-debug.log"

      - name: Report build failure details
        if: failure()
        shell: python
        run: |
          import os, pathlib, re, xml.etree.ElementTree as ET
          log = pathlib.Path(os.environ['RUNNER_TEMP']) / 'build-debug.log'
          if log.exists():
              lines = log.read_text(errors='replace').splitlines()
              compiler_errors = [line for line in lines if re.match(r'^\s*(?:e:|error:)', line)]
              for line in compiler_errors[:30]:
                  escaped = line[:6000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::warning title=Compiler error::{escaped}')
              starts = [i for i, line in enumerate(lines) if 'FAILURE: Build failed' in line]
              details = '\n'.join(lines[starts[-1]:starts[-1] + 65] if starts else lines[-65:])
              escaped = details[:12000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::warning title=Build failure summary::{escaped}')
          for report in pathlib.Path('app/build/test-results').rglob('TEST-*.xml'):
              for case in ET.parse(report).iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      details = f"{case.get('classname')}.{case.get('name')}: {failure.get('message')}\n{failure.text or ''}"
                      escaped = details[:6000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f'::warning title=Failed unit test::{escaped}')

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            ${{ runner.temp }}/build-debug.log
            app/build/test-results/
          if-no-files-found: ignore

      - name: Reject release dispatch from an untrusted branch
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.build_release &&
          github.ref != 'refs/heads/main' && github.ref != 'refs/heads/anthonys1998-Groq'
        run: |
          echo "::error::Signed releases can only be dispatched from main or anthonys1998-Groq."
          exit 1

      - name: Build and verify signed APK
        id: signed_apk
        if: >-
          (github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/anthonys1998-Groq')) ||
          (github.event_name == 'workflow_dispatch' && inputs.build_release &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/anthonys1998-Groq'))
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_EXPECTED_CERT_SHA256 }}
          BUILD_RELEASE_REQUEST: ${{ inputs.build_release }}
          RELEASE_VERSION_CODE: ${{ inputs.release_version_code }}
        run: |
          set -euo pipefail
          set +x
          is_push=false
          is_release_request=false
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then is_push=true; fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$BUILD_RELEASE_REQUEST" == "true" ]]; then is_release_request=true; fi
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_EXPECTED_CERT_SHA256; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            if [[ "$is_release_request" == true ]]; then
              echo "::error::Signed release requested, but signing credentials or ANDROID_EXPECTED_CERT_SHA256 are not configured."
              echo "The requested signed release was not produced. Configure the keystore secrets and expected certificate fingerprint, then rerun." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "::warning::Signed APK skipped: signing credentials or ANDROID_EXPECTED_CERT_SHA256 are not configured."
            echo "A Paperlight-debug APK will be uploaded. It uses the runner debug key and may not update an APK signed with a different key." >> "$GITHUB_STEP_SUMMARY"
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          expected_cert=$(printf '%s' "$ANDROID_EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if ! [[ "$expected_cert" =~ ^[0-9a-f]{64}$ ]]; then
            if [[ "$is_release_request" == true ]]; then
              echo "::error::Signed release requested, but ANDROID_EXPECTED_CERT_SHA256 is not a SHA-256 certificate fingerprint."
              echo "The requested signed release was not produced. Correct the expected certificate fingerprint and rerun." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "::warning::Signed APK skipped: ANDROID_EXPECTED_CERT_SHA256 is not a SHA-256 certificate fingerprint."
            echo "A Paperlight-debug APK will be uploaded instead; no unsigned or unverified signed APK will be published." >> "$GITHUB_STEP_SUMMARY"
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$is_push" == true ]]; then
            release_version_code=$((GITHUB_RUN_NUMBER + 40))
          else
            release_version_code="$RELEASE_VERSION_CODE"
          fi
          export RELEASE_VERSION_CODE="$release_version_code"
          if ! python3 - <<'PY'
          import os, re, sys
          raw = os.environ.get("RELEASE_VERSION_CODE", "")
          baseline = int(os.environ["UPDATE_BASELINE_VERSION_CODE"])
          if not re.fullmatch(r"[1-9][0-9]*", raw):
              sys.exit("Release versionCode must be a canonical positive integer.")
          code = int(raw)
          if not 1 <= code <= 2100000000:
              sys.exit("Release versionCode is outside Android's supported range.")
          if code <= baseline:
              sys.exit(f"Release versionCode must exceed the verified baseline {baseline}.")
          PY
          then
            if [[ "$is_push" == true ]]; then
              echo "::warning::Signed APK skipped: this run's versionCode does not exceed the existing versionCode floor 106."
              echo "A Paperlight-debug APK will be uploaded instead." >> "$GITHUB_STEP_SUMMARY"
              echo "built=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi

          release_keystore="$RUNNER_TEMP/vibe-reader-release.jks"
          umask 077
          trap 'rm -f "$release_keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$release_keystore"
          test -s "$release_keystore"
          unset ANDROID_KEYSTORE_BASE64
          export ANDROID_KEYSTORE_PATH="$release_keystore"
          gradle :app:assembleRelease -PappVersionCode="$release_version_code" --stacktrace
          unset ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD

          python3 - <<'PY'
          import os, re, subprocess, sys
          apk = "app/build/outputs/apk/release/app-release.apk"
          aapt = os.path.join(os.environ["ANDROID_HOME"], "build-tools", "36.0.0", "aapt")
          apksigner = os.path.join(os.environ["ANDROID_HOME"], "build-tools", "36.0.0", "apksigner")
          badging = subprocess.run([aapt, "dump", "badging", apk], check=True, capture_output=True, text=True).stdout
          package = re.search(r"^package: name='([^']+)' versionCode='([0-9]+)'", badging, re.M)
          if not package or package.group(1) != "com.paperlight.reader":
              sys.exit("Release APK has an unexpected or unreadable application ID.")
          if package.group(2) != os.environ["RELEASE_VERSION_CODE"]:
              sys.exit("Release APK versionCode does not match the selected version code.")
          if int(package.group(2)) <= int(os.environ["UPDATE_BASELINE_VERSION_CODE"]):
              sys.exit("Release APK versionCode does not exceed the existing versionCode floor.")
          signature = subprocess.run([apksigner, "verify", "--verbose", "--print-certs", apk],
                                     check=True, capture_output=True, text=True)
          signer_output = signature.stdout + signature.stderr
          actual = re.search(r"Signer #1 certificate SHA-256 digest:\s*([0-9A-Fa-f:]+)", signer_output)
          expected = os.environ["ANDROID_EXPECTED_CERT_SHA256"].replace(":", "").strip().lower()
          if not actual or actual.group(1).replace(":", "").lower() != expected:
              sys.exit("Release APK signer does not match ANDROID_EXPECTED_CERT_SHA256.")
          print("Signed APK package, versionCode, and signer verified.")
          PY
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK
        if: steps.signed_apk.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Paperlight-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload debug APK
        if: steps.signed_apk.outputs.built != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Paperlight-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
